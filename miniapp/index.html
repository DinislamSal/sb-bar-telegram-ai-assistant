<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S&B Bar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
    padding-bottom: 90px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px;
    overflow-x: auto;
    position: sticky;
    top: 0;
    background: var(--tg-theme-bg-color, #ffffff);
    z-index: 10;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #111);
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #fff);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px;
  }
  .card {
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .card .img-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eee;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    position: relative;
    overflow: hidden;
  }
  .placeholder::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.15;
    background-image: radial-gradient(circle, #fff 1.5px, transparent 1.5px);
    background-size: 16px 16px;
  }
  .placeholder span {
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .placeholder.cat-pizza { background: linear-gradient(135deg, #ff9a5a, #d4380d); }
  .placeholder.cat-rolls { background: linear-gradient(135deg, #5cdbd3, #08979c); }
  .placeholder.cat-fastfood { background: linear-gradient(135deg, #ffd666, #d48806); }
  .hit-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    background: #ff5722;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 10px;
  }
  .card-body {
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 33px;
  }
  .card-price {
    font-size: 14px;
    font-weight: 700;
    color: var(--tg-theme-link-color, #2ea6ff);
  }
  .card-action {
    margin-top: auto;
  }
  .add-btn {
    width: 100%;
    padding: 7px 0;
    border-radius: 10px;
    border: none;
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #fff);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--tg-theme-button-color, #2ea6ff);
    border-radius: 10px;
    overflow: hidden;
  }
  .stepper button {
    border: none;
    background: transparent;
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 16px;
    font-weight: 700;
    width: 30px;
    height: 30px;
    cursor: pointer;
  }
  .stepper span {
    color: var(--tg-theme-button-text-color, #fff);
    font-weight: 700;
    font-size: 13px;
  }

  /* Checkout screen */
  #checkout {
    display: none;
    padding: 14px;
  }
  .co-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .co-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    font-size: 14px;
  }
  .co-total {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 16px;
    padding: 12px 0;
  }
  .co-section {
    margin-top: 18px;
  }
  .co-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--tg-theme-hint-color, #888);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .choice-row {
    display: flex;
    gap: 8px;
  }
  .choice-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--tg-theme-secondary-bg-color, #eee);
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    color: var(--tg-theme-text-color, #111);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .choice-btn.selected {
    border-color: var(--tg-theme-button-color, #2ea6ff);
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #fff);
  }
  .field-input {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.15);
    font-size: 14px;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
  }
  #addressInput {
    display: none;
  }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--tg-theme-hint-color, #888);
  }

  /* Description modal */
  #descModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  #descModal.open { display: flex; }
  .desc-sheet {
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
    width: 100%;
    max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 18px;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .desc-photo {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .desc-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .desc-photo .placeholder { font-size: 60px; }
  .desc-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .desc-price { font-size: 16px; font-weight: 700; color: var(--tg-theme-link-color, #2ea6ff); margin-bottom: 10px; }
  .desc-text { font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
  .desc-text.muted { color: var(--tg-theme-hint-color, #888); font-style: italic; }
  .desc-close-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #111);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="menu">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="checkout">
  <div class="co-title">Ваш заказ</div>
  <div id="coItems"></div>
  <div class="co-total"><span>Итого</span><span id="coTotal">0 ₽</span></div>

  <div class="co-section">
    <div class="co-label">Способ получения</div>
    <div class="choice-row">
      <button class="choice-btn" id="methodDelivery" onclick="setMethod('Доставка')">🚗 Доставка</button>
      <button class="choice-btn" id="methodPickup" onclick="setMethod('Самовывоз')">🏠 Самовывоз</button>
    </div>
    <input type="text" id="addressInput" class="field-input" placeholder="Укажите адрес доставки">
  </div>

  <div class="co-section">
    <div class="co-label">Телефон для связи</div>
    <input type="tel" id="phoneInput" class="field-input" placeholder="+7 999 000-00-00">
  </div>

  <div class="co-section">
    <div class="co-label">Оплата</div>
    <div class="choice-row">
      <button class="choice-btn" id="payCard" onclick="setPayment('Картой')">💳 Картой</button>
      <button class="choice-btn" id="payCash" onclick="setPayment('Наличными')">💵 Наличными</button>
    </div>
  </div>
</div>

<div id="descModal" onclick="if(event.target===this) closeDescModal()">
  <div class="desc-sheet" id="descSheet"></div>
</div>

    {id:57, cat:"Фастфуды", name:"Снэк бокс", price:319, hit:false, photo:"https://thumbor.uds.app/unsafe/600x600//game-prod/549755920775/GOODS/9e6c7c95-ec57-4ad3-8b9c-ff3a752caaf4", desc:"Сырные палочки, луковые кольца, картофель фри, стрипсы"},
    {id:58, cat:"Фастфуды", name:"S&B box", price:279, hit:false, photo:"https://thumbor.uds.app/unsafe/600x600//game-prod/549755920775/GOODS/01cacd18-671e-4983-9115-4b82acf79104", desc:"Картофельные дольки, стрипсы, солёные огурцы, соус на выбор (горчичный, ореховый)"},
    {id:59, cat:"Фастфуды", name:"Острые крылышки", price:429, hit:false, photo:"https://thumbor.uds.app/unsafe/600x600//game-prod/549755920775/GOODS/0dd1a646-5459-4b5c-ab9f-db15743c89f1", desc:"Куриные крылышки"},
    {id:60, cat:"Фастфуды", name:"Картофель по-деревенски", price:179, hit:false, photo:"https://thumbor.uds.app/unsafe/600x600//game-prod/549755920775/GOODS/d3d27379-e7f7-43c9-be91-7eb44e390177", desc:"Картофельные дольки, соль, копчёная паприка, 185 г"},
  ];

  const CATS = ["Пицца", "Запечённые роллы", "Фастфуды"];
  const CAT_EMOJI = {"Пицца":"🍕", "Запечённые роллы":"🍣", "Фастфуды":"🍔"};
  const CAT_CLASS = {"Пицца":"cat-pizza", "Запечённые роллы":"cat-rolls", "Фастфуды":"cat-fastfood"};

  let activeCat = CATS[0];
  let cart = {}; // id -> qty
  let method = null;
  let payment = null;
  let checkoutOpen = false;

  function renderTabs() {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    CATS.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (cat === activeCat ? ' active' : '');
      btn.textContent = CAT_EMOJI[cat] + ' ' + cat;
      btn.onclick = () => { activeCat = cat; renderTabs(); renderGrid(); };
      tabsEl.appendChild(btn);
    });
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    const items = MENU.filter(i => i.cat === activeCat).sort((a, b) => b.hit - a.hit);
    items.forEach(item => {
      const qty = cart[item.id] || 0;
      const card = document.createElement('div');
      card.className = 'card';

      const imgWrap = document.createElement('div');
      imgWrap.className = 'img-wrap';
      if (item.photo) {
        imgWrap.innerHTML = `<img src="${item.photo}" alt="${item.name}">`;
        if (item.hit) {
          const badge = document.createElement('div');
          badge.className = 'hit-badge';
          badge.textContent = '🔥 Хит';
          imgWrap.appendChild(badge);
        }
      } else {
        imgWrap.innerHTML = `<div class="placeholder ${CAT_CLASS[item.cat]}"><span>${CAT_EMOJI[item.cat]}</span></div>`;
      }
      imgWrap.onclick = () => openDescModal(item.id);
      card.appendChild(imgWrap);

      const body = document.createElement('div');
      body.className = 'card-body';
      body.innerHTML = `
        <div class="card-name">${item.name}</div>
        <div class="card-price">${item.price} ₽</div>
        <div class="card-action" id="action-${item.id}"></div>
      `;
      card.appendChild(body);
      gridEl.appendChild(card);
      renderAction(item.id);
    });
  }

  function renderAction(id) {
    const el = document.getElementById('action-' + id);
    const qty = cart[id] || 0;
    if (qty === 0) {
      el.innerHTML = `<button class="add-btn" onclick="addItem(${id})">Добавить</button>`;
    } else {
      el.innerHTML = `
        <div class="stepper">
          <button onclick="decItem(${id})">−</button>
          <span>${qty}</span>
          <button onclick="incItem(${id})">+</button>
        </div>`;
    }
  }

  function addItem(id) {
    cart[id] = (cart[id] || 0) + 1;
    renderAction(id);
    updateMainButton();
  }
  function incItem(id) {
    cart[id] = (cart[id] || 0) + 1;
    renderAction(id);
    updateMainButton();
  }
  function decItem(id) {
    cart[id] = (cart[id] || 0) - 1;
    if (cart[id] <= 0) delete cart[id];
    renderAction(id);
    updateMainButton();
  }

  function cartCount() {
    return Object.values(cart).reduce((a,b) => a+b, 0);
  }
  function cartTotal() {
    return Object.entries(cart).reduce((sum, [id, qty]) => {
      const item = MENU.find(i => i.id == id);
      return sum + item.price * qty;
    }, 0);
  }

  function updateMainButton() {
    if (checkoutOpen) return;
    const count = cartCount();
    if (count > 0) {
      tg.MainButton.setText(`Корзина • ${count} • ${cartTotal()} ₽`);
      tg.MainButton.enable();
      tg.MainButton.show();
    } else {
      tg.MainButton.hide();
    }
  }

  tg.MainButton.onClick(() => {
    if (!checkoutOpen) {
      openCheckout();
    } else {
      submitOrder();
    }
  });

  tg.BackButton.onClick(() => {
    closeCheckout();
  });

  function openCheckout() {
    checkoutOpen = true;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('checkout').style.display = 'block';
    tg.BackButton.show();
    renderCheckout();
  }
  function closeCheckout() {
    checkoutOpen = false;
    document.getElementById('menu').style.display = 'block';
    document.getElementById('checkout').style.display = 'none';
    tg.BackButton.hide();
    updateMainButton();
  }

  function renderCheckout() {
    const coItems = document.getElementById('coItems');
    coItems.innerHTML = '';
    Object.entries(cart).forEach(([id, qty]) => {
      const item = MENU.find(i => i.id == id);
      const row = document.createElement('div');
      row.className = 'co-item';
      row.innerHTML = `<span>${item.name} × ${qty}</span><span>${item.price * qty} ₽</span>`;
      coItems.appendChild(row);
    });
    document.getElementById('coTotal').textContent = cartTotal() + ' ₽';
    updateCheckoutButton();
  }

  function setMethod(m) {
    method = m;
    document.getElementById('methodDelivery').classList.toggle('selected', m === 'Доставка');
    document.getElementById('methodPickup').classList.toggle('selected', m === 'Самовывоз');
    document.getElementById('addressInput').style.display = (m === 'Доставка') ? 'block' : 'none';
    updateCheckoutButton();
  }
  function setPayment(p) {
    payment = p;
    document.getElementById('payCard').classList.toggle('selected', p === 'Картой');
    document.getElementById('payCash').classList.toggle('selected', p === 'Наличными');
    updateCheckoutButton();
  }

  document.getElementById('addressInput').addEventListener('input', updateCheckoutButton);
  document.getElementById('phoneInput').addEventListener('input', updateCheckoutButton);

  function updateCheckoutButton() {
    const address = document.getElementById('addressInput').value.trim();
    const addressOk = method !== 'Доставка' || address.length > 3;
    const phone = document.getElementById('phoneInput').value.trim();
    const phoneOk = phone.length >= 10;
    const ready = method && payment && addressOk && phoneOk && cartCount() > 0;
    tg.MainButton.setText('Отправить заказ');
    if (ready) {
      tg.MainButton.enable();
      tg.MainButton.color = tg.themeParams.button_color || '#2ea6ff';
    } else {
      tg.MainButton.disable();
    }
    tg.MainButton.show();
  }

  function openDescModal(id) {
    const item = MENU.find(i => i.id === id);
    const sheet = document.getElementById('descSheet');
    let photoHtml;
    if (item.photo) {
      photoHtml = `<div class="desc-photo"><img src="${item.photo}" alt="${item.name}"></div>`;
    } else {
      photoHtml = `<div class="desc-photo"><div class="placeholder ${CAT_CLASS[item.cat]}" style="aspect-ratio:auto;"><span>${CAT_EMOJI[item.cat]}</span></div></div>`;
    }
    const descHtml = item.desc
      ? `<div class="desc-text">${item.desc}</div>`
      : `<div class="desc-text muted">Подробный состав уточняйте у персонала при заказе</div>`;
    sheet.innerHTML = `
      ${photoHtml}
      <div class="desc-name">${item.name}${item.hit ? ' 🔥' : ''}</div>
      <div class="desc-price">${item.price} ₽</div>
      ${descHtml}
      <button class="desc-close-btn" onclick="closeDescModal()">Закрыть</button>
    `;
    document.getElementById('descModal').classList.add('open');
  }
  function closeDescModal() {
    document.getElementById('descModal').classList.remove('open');
  }

  function submitOrder() {
    const address = document.getElementById('addressInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const items = Object.entries(cart).map(([id, qty]) => {
      const item = MENU.find(i => i.id == id);
      return { name: item.name, price: item.price, qty: qty };
    });
    const payload = {
      items: items,
      total: cartTotal(),
      method: method,
      address: method === 'Доставка' ? address : '',
      phone: phone,
      payment: payment
    };
    tg.sendData(JSON.stringify(payload));
  }

  renderTabs();
  renderGrid();
  updateMainButton();
</script>
